<script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const fileInput = document.getElementById('file-input');
    const messages = document.getElementById('messages');

    let replyingToText = null; // Переменная для хранения текста ответа

    let myId = localStorage.getItem('chat_id');
    if (!myId) {
        myId = Math.random().toString(36).substring(2);
        localStorage.setItem('chat_id', myId);
    }

    function renderMessage(data) {
        const item = document.createElement('li');
        
        // Стилизация своего/чужого сообщения
        if (data.clientId === myId) {
            item.style.backgroundColor = '#dcf8c6';
            item.style.alignSelf = 'flex-end';
        } else {
            item.style.backgroundColor = '#ffffff';
            item.style.alignSelf = 'flex-start';
        }

        // Если это ответ — рисуем блок с цитатой
        if (data.replyTo) {
            const replyDiv = document.createElement('div');
            replyDiv.style.background = 'rgba(0,0,0,0.05)';
            replyDiv.style.borderLeft = '3px solid #0088cc';
            replyDiv.style.padding = '5px';
            replyDiv.style.fontSize = '0.8em';
            replyDiv.style.marginBottom = '5px';
            replyDiv.textContent = '↪ ' + data.replyTo;
            item.appendChild(replyDiv);
        }

        if (data.type === 'text') {
            const textSpan = document.createElement('span');
            textSpan.textContent = data.content;
            item.appendChild(textSpan);
        } else if (data.type === 'image') {
            const img = document.createElement('img');
            img.src = data.content;
            item.appendChild(img);
        }

        // Клик на сообщение, чтобы ответить на него
        item.onclick = () => {
            replyingToText = data.type === 'text' ? data.content : 'Фотография';
            input.placeholder = "Ответ на: " + replyingToText;
            input.focus();
        };

        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    }

    socket.on('load history', (history) => {
        messages.innerHTML = '';
        history.forEach(renderMessage);
    });

    socket.on('chat message', renderMessage);

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            socket.emit('chat message', { 
                type: 'text', 
                content: input.value, 
                clientId: myId,
                replyTo: replyingToText // Отправляем текст ответа
            });
            input.value = '';
            replyingToText = null; // Сбрасываем ответ
            input.placeholder = "Сообщение...";
        }
    });

    // ... (код для фото остается таким же, просто добавь replyTo: replyingToText в emit)
</script>
